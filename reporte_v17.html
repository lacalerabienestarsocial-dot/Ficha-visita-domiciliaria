<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Visita Domiciliaria · Bienestar Social · La Calera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f2f7f3;
  --title:#2e6144;
  --primary:#00823d;
  --primary-dark:#00622d;
  --accent-light:#e3f3e8;
  --accent-mid:#a9dab9;
  --accent-soft:#d7ecdd;
  --surface:#ffffff;
  --border:#cfe6d7;
  --text:#1c2b21;
  --muted:#5f746a;
  --danger:#b3261e;
  --warning:#e08900;
  --medio:#c99a00;
  --radius:16px;
  --shadow:0 2px 10px rgba(24,64,40,.07);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  padding-bottom:84px;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Poppins',system-ui,sans-serif;color:var(--title);margin:0 0 4px;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent-mid);}

/* ---------- Header ---------- */
.app-header{
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
  color:#fff;
  padding:18px 20px 22px;
  border-radius:0 0 24px 24px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.app-header::after{
  content:"";
  position:absolute; right:-40px; top:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.08);
  pointer-events:none;
  z-index:0;
}
.app-header .eyebrow{
  font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  opacity:.85; font-weight:600;
}
.app-header h1{color:#fff; font-size:20px; margin-top:2px;}
.app-header .sub{font-size:12.5px; opacity:.9; margin-top:2px;}

/* ---------- Nav (bottom tab bar) ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0;
  display:flex; background:#fff;
  border-top:1px solid var(--border);
  box-shadow:0 -2px 12px rgba(24,64,40,.08);
  z-index:50;
}
.tabbar button{
  flex:1; border:none; background:none; cursor:pointer;
  padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--muted); font-size:10.5px; font-weight:600;
}
.tabbar button svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;}
.tabbar button.active{color:var(--primary);}
.tabbar button.active svg{stroke:var(--primary);}

/* ---------- Layout ---------- */
main{max-width:720px;margin:0 auto;padding:16px;}
.view{display:none;}
.view.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:16px; margin-bottom:14px;
  box-shadow:var(--shadow);
}
.card h3{font-size:15.5px;}
.section-label{
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  color:var(--primary); background:var(--accent-light);
  padding:4px 10px; border-radius:999px; margin-bottom:10px;
}

/* ---------- Form elements ---------- */
label.field-label{display:block; font-size:13px; font-weight:600; color:var(--title); margin:14px 0 6px;}
label.field-label:first-child{margin-top:0;}
input[type=text],input[type=number],input[type=tel],select,textarea{
  width:100%; padding:11px 12px; border-radius:11px; border:1.5px solid var(--border);
  background:#fbfefc; font-size:14.5px; color:var(--text); font-family:inherit;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-mid); border-color:var(--primary);}
textarea{min-height:60px; resize:vertical;}
.hint{font-size:11.5px; color:var(--muted); margin-top:4px;}

.option-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.option-row{
  display:flex; align-items:center; gap:10px;
  border:1.5px solid var(--border); border-radius:12px; padding:10px 12px;
  cursor:pointer; background:#fbfefc; transition:.15s;
}
.option-row:active{transform:scale(.99);}
.option-row.selected{border-color:var(--primary); background:var(--accent-light);}
.option-row input{accent-color:var(--primary); width:17px;height:17px; flex-shrink:0;}
.option-row .opt-label{font-size:13.5px; flex:1; line-height:1.35;}
.option-row .pts-badge{
  font-size:10.5px; font-weight:700; color:var(--primary);
  background:#fff; border:1px solid var(--accent-mid); border-radius:999px; padding:2px 7px;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:12px 18px; border-radius:12px; border:none; cursor:pointer;
  font-weight:600; font-size:14px; transition:.15s;
}
.btn-primary{background:var(--primary); color:#fff;}
.btn-primary:active{background:var(--primary-dark);}
.btn-outline{background:#fff; color:var(--primary); border:1.5px solid var(--primary);}
.btn-block{width:100%;}
.btn-ghost{background:var(--accent-light); color:var(--title);}
.btn-danger-outline{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

.form-nav{display:flex; gap:10px; margin-top:6px;}

/* stepper */
.stepper{display:flex; gap:6px; margin-bottom:16px;}
.stepper .dot{flex:1; height:6px; border-radius:4px; background:var(--border);}
.stepper .dot.done,.stepper .dot.current{background:var(--primary);}

/* photo mini section */
.photo-box{
  margin-top:10px; border:1.5px dashed var(--accent-mid); border-radius:12px; padding:10px;
  background:var(--accent-light);
}
.photo-box .mini-meta{display:flex; gap:8px; font-size:11.5px; color:var(--muted); margin-bottom:8px; flex-wrap:wrap;}
.photo-box .mini-meta span{background:#fff; border:1px solid var(--border); padding:2px 8px; border-radius:999px;}
.photo-preview{width:100%; max-height:180px; object-fit:cover; border-radius:10px; margin-top:8px; display:none;}
.file-btn{
  display:inline-flex; align-items:center; gap:6px; background:#fff; border:1.5px solid var(--primary);
  color:var(--primary); padding:9px 14px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer;
}

/* autofill card */
.autofill-card{background:var(--accent-light); border:1px solid var(--accent-mid); border-radius:12px; padding:10px 12px; margin-top:10px;}
.autofill-card .row{display:flex; justify-content:space-between; gap:8px; font-size:12.5px; padding:3px 0;}
.autofill-card .row b{color:var(--title); font-weight:600;}
.badge-ok{color:var(--primary); font-weight:700; font-size:12px;}
.badge-warn{color:var(--warning); font-weight:700; font-size:12px;}

.map-link{display:inline-flex; align-items:center; gap:6px; color:var(--primary); font-weight:600; font-size:13px; text-decoration:none; margin-top:6px;}
.map-embed-box{margin-top:8px; border-radius:12px; overflow:hidden; border:1.5px solid var(--border);}
.map-picker-wrap{margin-top:10px;}
#mapPicker{height:230px; border-radius:12px; overflow:hidden; border:1.5px solid var(--border); background:var(--accent-light);}
.leaflet-pane, .leaflet-control{z-index:5 !important;}

/* result screen */
.score-circle{
  width:130px;height:130px;border-radius:50%; margin:6px auto 12px; display:flex; align-items:center; justify-content:center;
  flex-direction:column; border:8px solid var(--accent-mid); background:#fff;
}
.score-circle .num{font-size:30px; font-weight:800; font-family:'Poppins',sans-serif;}
.score-circle .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
.nivel-pill{display:inline-block; padding:5px 14px; border-radius:999px; font-weight:700; font-size:12.5px; color:#fff;}

/* filters */
.filters{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
.filters select{font-size:12.5px; padding:9px 10px;}
.filters .full{grid-column:1/-1;}

/* bar chart */
.qblock{margin-bottom:18px;}
.qblock .qtitle{font-size:13px; font-weight:700; color:var(--title); margin-bottom:8px;}
.barrow{margin-bottom:7px;}
.barrow .barlabel{display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:3px; color:var(--text);}
.barrow .bartrack{height:9px; background:var(--accent-light); border-radius:6px; overflow:hidden;}
.barrow .barfill{height:100%; background:var(--primary); border-radius:6px;}

.stat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
.stat-card{background:var(--accent-light); border-radius:12px; padding:10px; text-align:center;}
.stat-card .n{font-size:19px; font-weight:800; color:var(--title); font-family:'Poppins',sans-serif;}
.stat-card .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}

.gerencia-row{margin-bottom:12px;}
.gerencia-row .gname{font-size:12.5px; font-weight:700; margin-bottom:5px; display:flex; justify-content:space-between;}
.stackbar{display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--accent-light);}
.stackbar div{height:100%;}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:10.5px; color:var(--muted); margin:8px 0 4px;}
.legend span{display:inline-flex; align-items:center; gap:4px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

table.data-table{width:100%; border-collapse:collapse; font-size:12px;}
table.data-table th{background:var(--accent-light); color:var(--title); text-align:left; padding:7px 8px; position:sticky; top:0;}
table.data-table td{padding:7px 8px; border-bottom:1px solid var(--border);}
table.data-table tr:active{background:var(--accent-light);}
.table-scroll{max-height:56vh; overflow:auto; border:1px solid var(--border); border-radius:12px;}

.search-box{display:flex; gap:8px; margin-bottom:10px;}
.empty-state{text-align:center; padding:30px 10px; color:var(--muted);}
.empty-state svg{width:44px;height:44px;stroke:var(--accent-mid);margin-bottom:8px;}

.ref-card{border-left:4px solid var(--primary); padding-left:12px; margin-bottom:14px;}
.ref-opt{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-bottom:1px dashed var(--border);}

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,40,28,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:100;
}
.modal-overlay.open{display:flex;}
.modal-sheet{
  background:#fff; width:100%; max-width:720px; max-height:85vh; overflow:auto;
  border-radius:20px 20px 0 0; padding:18px; animation:slideUp .2s ease;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
.modal-close{float:right; border:none; background:var(--accent-light); border-radius:999px; width:30px;height:30px; cursor:pointer; color:var(--title); font-size:16px;}

.toast{
  position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
  background:var(--title); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px;
  box-shadow:var(--shadow); z-index:200; opacity:0; pointer-events:none; transition:.25s;
}
.toast.show{opacity:1; transform:translate(-50%,-6px);}

.notice{background:#fff7e6; border:1px solid #f0d38a; color:#7a5b00; font-size:12px; padding:9px 12px; border-radius:10px; margin-bottom:12px;}

@media (min-width:600px){
  .tabbar button{font-size:11.5px;}
  main{padding:20px;}
}
@media (min-width:768px){
  main{max-width:760px; padding:26px;}
  .app-header{padding:24px 28px 28px;}
  .app-header h1{font-size:23px;}
  .card{padding:20px;}
  .tabbar{max-width:760px; left:50%; transform:translateX(-50%); border-radius:20px 20px 0 0;}
  .tabbar button{font-size:12.5px; padding:12px 4px 10px;}
  .tabbar button svg{width:22px;height:22px;}
  #mapPicker{height:300px;}
  .option-row{padding:12px 14px;}
  input[type=text],input[type=number],input[type=tel],select,textarea{font-size:15.5px; padding:12px 14px;}
}
/* ---------- Reporte ---------- */
.rp-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px;}
.rp-kpis div{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;}
.rp-kpis b{display:block;font-family:'Poppins',sans-serif;font-size:26px;line-height:1.1;color:var(--title);}
.rp-kpis span{font-size:11.5px;color:var(--muted);}
.rp-gtable{font-size:11.5px;}.rp-gtable td,.rp-gtable th{padding:7px 4px;}.rp-gtable td:first-child{font-weight:600;}
.rp-gtable td,.rp-gtable th{text-align:center;}
.rp-gtable td:first-child,.rp-gtable th:first-child{text-align:left;}
.rp-grow{cursor:pointer;}
.rp-total td{background:var(--accent-light);font-weight:700;}
.rp-map{height:320px;border-radius:12px;overflow:hidden;border:1px solid var(--border);margin-top:8px;}
.rp-card{border:1px solid var(--border);border-left:6px solid var(--border);border-radius:12px;padding:12px;margin-top:10px;background:#fff;break-inside:avoid;}
.rp-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.rp-nivel{color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;}
.rp-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px;font-size:12.5px;}
.rp-meta span{display:block;font-size:10.5px;color:var(--muted);}
.rp-meta .wide{grid-column:1/-1;}
.rp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.rp-actions .btn{padding:7px 11px;font-size:12px;text-decoration:none;}
.rp-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px;}
.rp-photo{display:block;text-decoration:none;color:var(--text);font-size:10.5px;}
.rp-photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid var(--border);display:block;}
.rp-photo span{display:block;margin-top:2px;line-height:1.2;}
.rp-nothumb{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--accent-light);border-radius:8px;color:var(--primary);font-weight:600;}
.rz{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-top:2px;}
.rz-si{background:#fde7e5;color:#b3261e;}
.rz-no{background:#e3f3e8;color:#00622d;}
.rz-nd{background:#eee;color:#666;}
.rp-det{margin-top:10px;border:1px solid var(--border);border-radius:12px;background:#fff;}
.rp-det summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:13.5px;color:var(--title);list-style:none;display:flex;justify-content:space-between;align-items:center;}
.rp-det summary::-webkit-details-marker{display:none;}
.rp-det summary::after{content:'▾';transition:transform .2s;}
.rp-det[open] summary::after{transform:rotate(180deg);}
.rp-det .table-scroll{margin:0 10px 10px;}
@media print{.rp-det{border:none;}.rp-det:not([open]) > *:not(summary){display:block;}}
.rp-lvl{cursor:pointer;transition:background .15s;}
.rp-lvl.active{background:var(--accent-light) !important;box-shadow:0 0 0 2px currentColor inset;}
.est-tile{cursor:pointer;}
.est-tile.active{background:var(--accent-light) !important;box-shadow:0 0 0 2px currentColor inset;}
.est-tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;}
.rp-prog{height:12px;background:var(--accent-light);border-radius:99px;overflow:hidden;margin-top:10px;}
.rp-prog div{height:100%;background:var(--primary);border-radius:99px;}
.print-title{display:none;}
@media print{
  .app-header,.tabbar,.no-print,.leaflet-control,.toast{display:none !important;}
  body{background:#fff;padding-bottom:0;}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:auto;}
  .print-title{display:block;font-weight:700;font-size:14px;margin:0 0 8px;}
  .rp-map{height:300px;}
  .rp-photos{grid-template-columns:repeat(4,1fr);}
  .table-scroll{max-height:none !important;overflow:visible !important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>

<div class="app-header">
  <div class="eyebrow">La Calera S.A.C. · Bienestar Social</div>
  <h1>Ficha de Visita Domiciliaria</h1>
  <div class="sub">Marcado rápido con valorización · Zonas de riesgo</div>
</div>

<main id="main"></main>

<div class="tabbar" id="tabbar"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet" id="modalSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>

function buildGoogleFormLink(){
  const c = state.colaborador;

  params.set('usp', 'pp_url');
  const dni = c.dni; if(dni) params.set(GOOGLE_FORM_ENTRIES.dni, dni);

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normDni(s){ return (s||'').toString().trim(); }

/* =========================================================
   ALMACENAMIENTO: Google Sheets vía Apps Script
   (reemplaza el almacenamiento interno de Claude para que la web
   funcione de forma independiente, con GPS real y datos persistentes)
========================================================= */
function getBackendUrlFromQuery(){
  try{
    const params = new URLSearchParams(window.location.search);
    const v = params.get('backend');
    return v ? decodeURIComponent(v) : '';
  }catch(e){ return ''; }
}
// Prioridad: 1) enlace en la propia URL (?backend=...) — sobrevive aunque el navegador borre datos locales
//            2) lo guardado localmente en este navegador
// Enlace de Apps Script ya integrado: cualquier dispositivo que abra esta web
// queda conectado automáticamente, sin necesidad de configurar nada.
const DEFAULT_BACKEND_URL = 'https://script.google.com/macros/s/AKfycby_HMealiOfvsD-U0zyfrAX2UAxq3rhwRXlKQHwK1bDw57E7ItxI5eGaPO5yYb6yJvdGQ/exec';
let BACKEND_URL = getBackendUrlFromQuery() || localStorage.getItem('backendUrl') || DEFAULT_BACKEND_URL;

function persistBackendUrl(val){
  BACKEND_URL = val;
  try{ localStorage.setItem('backendUrl', val); }catch(e){ /* algunos navegadores bloquean localStorage */ }
  // Refleja el enlace en la propia URL de la página, para que un marcador/acceso directo
  // guardado desde este momento SIEMPRE recuerde la conexión, sin depender del navegador.
  try{
    const url = new URL(window.location.href);
    url.searchParams.set('backend', val);
    window.history.replaceState(null, '', url.toString());
  }catch(e){ /* no crítico */ }
}

function showBackendSetupModal(closable){
  document.getElementById('modalSheet').innerHTML = `
    ${closable ? '<button class="modal-close" id="closeBackendModal">✕</button>' : ''}
    <h3>Conectar con Google Sheets</h3>
    <p class="hint">Pega aquí el enlace de tu Apps Script (el que termina en <b>/exec</b>) para que la ficha guarde y lea tus datos desde tu Google Sheet.</p>
    <input type="text" id="backendUrlInput" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(BACKEND_URL)}" style="margin:10px 0;">
    <button class="btn btn-primary btn-block" id="saveBackendUrl">Guardar y continuar</button>
    <p class="hint" style="margin-top:12px;">Después de guardar, la dirección de esta página va a cambiar (le agrega tu enlace al final). <b>Guarda esa página en marcadores o en tu pantalla de inicio recién después de esto</b> — así, aunque el navegador borre otros datos, el acceso directo siempre recordará la conexión.</p>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  const closeBtn = document.getElementById('closeBackendModal');
  if(closeBtn) closeBtn.addEventListener('click', closeModal);
  document.getElementById('saveBackendUrl').addEventListener('click', ()=>{
    const val = document.getElementById('backendUrlInput').value.trim();
    if(!val){ toast('Pega el enlace primero'); return; }
    persistBackendUrl(val);
    document.getElementById('modalOverlay').classList.remove('open');
    state.cache.rows = null;
    toast('Conectado con Google Sheets. Ahora guarda esta página en marcadores.');
    renderMain();
  });
}

async function apiFetchAllRows(){
  if(!BACKEND_URL) return [];
  try{
    const r = await fetch(BACKEND_URL + '?action=list');
    const data = await r.json();
    return data.rows || [];
  }catch(e){
    console.error('apiFetchAllRows error', e);
    toast('No se pudo conectar con tu Google Sheet. Revisa el enlace en ⚙️.');
    return [];
  }
}

async function openPhotosFolder(){
  if(!BACKEND_URL){ toast('Primero configura tu Google Sheet'); showBackendSetupModal(true); return; }
  const newWin = window.open('', '_blank'); // se abre de inmediato (dentro del gesto del usuario) para evitar el bloqueo de pop-ups
  toast('Abriendo carpeta de fotos...');
  try{
    const r = await fetch(BACKEND_URL + '?action=photosFolder');
    const data = await r.json();
    if(data && data.url){
      if(newWin) newWin.location.href = data.url;
      else window.open(data.url, '_blank');
    } else {
      toast('No se pudo obtener el enlace de la carpeta de fotos');
      if(newWin) newWin.close();
    }
  }catch(e){
    console.error('openPhotosFolder error', e);
    toast('No se pudo conectar con Google Drive');
    if(newWin) newWin.close();
  }
}

async function apiSaveRow(row){
  if(!BACKEND_URL){ showBackendSetupModal(true); toast('Primero configura tu Google Sheet'); return false; }
  try{
    await fetch(BACKEND_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'}, // evita el preflight CORS que Apps Script no soporta
      body: JSON.stringify({action:'save', row})
    });
    return true;
  }catch(e){
    console.error('apiSaveRow error', e);
    toast('No se pudo guardar en Google Sheets. Verifica tu conexión.');
    return false;
  }
}

  }catch(e){
    console.error('apiSavePhoto error', e);
    toast('No se pudo subir la foto a Google Drive. Verifica tu conexión.');
    return false;
  }
}

async function fetchAllRows(force){
  if(state.cache.rows && !force) return state.cache.rows;
  const rows = await apiFetchAllRows();
  state.cache.rows = rows;
  return rows;
}

function safeParse(json){ try{ return JSON.parse(json); }catch(e){ return null; } }

async function getIndex(force){
  const rows = await fetchAllRows(force);
  return rows.map(r => safeParse(r.IndexJSON)).filter(Boolean);
}

let _fullMapRows = null, _fullMap = null;
async function getFullVisit(id){
  const rows = await fetchAllRows();
  if(_fullMapRows !== rows){
    _fullMapRows = rows; _fullMap = {};
    rows.forEach(r => { const idx = safeParse(r.IndexJSON); if(idx && idx.id) _fullMap[idx.id] = r; });
  }
  const match = _fullMap[id];
  return match ? safeParse(match.FullJSON) : null;
}

function stripPhotos(fullRecord){
  const copy = JSON.parse(JSON.stringify(fullRecord));
  if(copy.colaborador) delete copy.colaborador.fotoVivienda;
  if(copy.answersFull){
    Object.values(copy.answersFull).forEach(a=>{ if(a && a.foto) delete a.foto; });
  }
  return copy;
}

async function pushVisit(indexEntry, fullRecord){
  const flat = flattenVisitRow(indexEntry, fullRecord);
  const strippedFull = stripPhotos(fullRecord);
  const row = {...flat, IndexJSON: JSON.stringify(indexEntry), FullJSON: JSON.stringify(strippedFull)};
  const ok = await apiSaveRow(row);
  if(ok){
    await fetchAllRows(true);
    toast('Ficha guardada en Google Sheets');
  }
  return ok;
}

// Comprime una imagen (File) a dataURL JPEG reducido
function compressImage(file, maxW){
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = () => resolve(null);
      img.src = e.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

/* ---------- MAPA INTERACTIVO (Leaflet) ---------- */
let leafletMap = null;
let leafletMarker = null;
const DEFAULT_MAP_CENTER = [-12.0464, -77.0428]; // Lima

function initMapPicker(){
  const el = document.getElementById('mapPicker');
  if(!el || typeof L === 'undefined') return;
  if(leafletMap){ leafletMap.remove(); leafletMap = null; }
  const c = state.colaborador;
  const start = c.ubicacion ? [c.ubicacion.lat, c.ubicacion.lng] : DEFAULT_MAP_CENTER;

  leafletMap = L.map(el, {zoomControl:true}).setView(start, c.ubicacion?16:12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(leafletMap);

  leafletMarker = L.marker(start, {draggable:true}).addTo(leafletMap);
  leafletMarker.on('dragend', ()=>{
    const p = leafletMarker.getLatLng();
    setLocation(p.lat, p.lng);
  });
  leafletMap.on('click', (e)=>{
    leafletMarker.setLatLng(e.latlng);
    setLocation(e.latlng.lat, e.latlng.lng);
  });

  // arreglo de tamaño por si el contenedor no tenía dimensiones al inicializar
  setTimeout(()=> leafletMap && leafletMap.invalidateSize(), 200);
}

async function reverseGeocode(lat, lng){
  // Intento 1: BigDataCloud (rápido, buen detalle en ciudades)
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=es`);
    const j = await r.json();
    const dir = [j.locality, j.city, j.principalSubdivision].filter(Boolean).join(', ');
    if(dir) return dir;
  }catch(err){ /* seguimos con el siguiente intento */ }

  // Intento 2: Nominatim / OpenStreetMap (respaldo, buena cobertura en zonas periurbanas)
  try{
    const r2 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=es`);
    const j2 = await r2.json();
    if(j2 && j2.display_name) return j2.display_name;
  }catch(err){ /* seguimos con el respaldo final */ }

  return null;
}

async function setLocation(lat, lng, opts){
  opts = opts || {};
  const mapsLink = `https://www.google.com/maps?q=${lat},${lng}`;
  state.colaborador.ubicacion = {lat, lng, mapsLink};
  updateGeoLinkText();
  if(!opts.skipGeocode){
    const status = document.getElementById('geoStatus');
    if(status) status.textContent = 'Ubicación marcada. Buscando dirección...';
    const dir = await reverseGeocode(lat, lng);
    const dirInput = document.getElementById('f_direccionGeo');
    if(dir){
      state.colaborador.direccionTexto = dir;
      if(dirInput) dirInput.value = dir;
      if(status) status.textContent = 'Ubicación marcada. Dirección aproximada obtenida (puedes editarla).';
    } else {
      // Respaldo final: no dejar el campo vacío, mostrar coordenadas para que edite sobre eso
      const coordText = `Coordenadas: ${lat.toFixed(5)}, ${lng.toFixed(5)} (escribe aquí la dirección exacta)`;
      if(dirInput && !dirInput.value){
        dirInput.value = coordText;
        state.colaborador.direccionTexto = coordText;
      }
      if(status) status.textContent = 'Ubicación marcada correctamente (pin y enlace de Maps listos). No se pudo autocompletar el texto de la dirección; puedes escribirla o corregirla tú misma.';
    }
  }
}

function updateGeoLinkText(){
  const box = document.getElementById('geoMapLink');
  if(!box || !state.colaborador.ubicacion) return;
  const u = state.colaborador.ubicacion;
  box.innerHTML = `<a class="map-link" href="${u.mapsLink}" target="_blank" rel="noopener">🗺️ Abrir esta ubicación en Google Maps (${u.lat.toFixed(5)}, ${u.lng.toFixed(5)})</a>`;
}

function handleGeo(){
  const status = document.getElementById('geoStatus');
  if(!navigator.geolocation){ status.textContent = 'Este dispositivo no soporta geolocalización.'; return; }
  status.textContent = 'Obteniendo ubicación...';
  navigator.geolocation.getCurrentPosition((pos)=>{
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    if(leafletMap && leafletMarker){
      leafletMarker.setLatLng([lat,lng]);
      leafletMap.setView([lat,lng], 17);
    }
    setLocation(lat, lng);
  }, (err)=>{
    status.textContent = 'No se pudo obtener tu ubicación automáticamente (revisa los permisos de GPS). Puedes marcarla tocando el mapa.';
  }, {enableHighAccuracy:true, timeout:10000});
}

/* ---------- RENDER GENÉRICO DE PREGUNTA ---------- */
function isOtroLabel(label){ return /otro/i.test(label||''); }
function questionHasOtro(q){ return !!(q.options && q.options.some(o=>isOtroLabel(o.label))); }
function otroIsSelected(q, existing){
  if(!existing) return false;
  if(q.type==='checkbox') return (existing.values||[]).some(isOtroLabel);
  return isOtroLabel(existing.value);
}

function renderQuestionCard(q){
  const div = document.createElement('div');
  div.className = 'card qcard';
  const existing = state.answers[q.code] || {};
  const hasOtro = questionHasOtro(q);

  let inner = `<div class="section-label">${q.code}</div><h3>${esc(q.title)}</h3>`;
  if(q.subtitle) inner += `<p class="hint">${esc(q.subtitle)}</p>`;

  if(q.type==='select' || q.type==='filter'){
    inner += `<div class="option-list" data-code="${q.code}" data-kind="radio">`;
    q.options.forEach((opt,i)=>{
      const sel = existing.value === opt.label;
      inner += `<label class="option-row ${sel?'selected':''}">
        <input type="radio" name="q_${q.code}" value="${esc(opt.label)}" ${sel?'checked':''}>
        <span class="opt-label">${esc(opt.label)}</span>
      </label>`;
    });
    inner += `</div>`;
  } else if(q.type==='checkbox'){
    inner += `<div class="option-list" data-code="${q.code}" data-kind="checkbox">`;
    const vals = existing.values || [];
    q.options.forEach(opt=>{
      const sel = vals.includes(opt.label);
      inner += `<label class="option-row ${sel?'selected':''}">
        <input type="checkbox" name="q_${q.code}" value="${esc(opt.label)}" ${sel?'checked':''}>
        <span class="opt-label">${esc(opt.label)}</span>
      </label>`;
    });
    inner += `</div>`;
  } else if(q.type==='number_score'){
    inner += `<label class="field-label">N° de veces afectada</label>
      <input type="number" min="0" id="num_${sid(q.code)}" value="${existing.value ?? ''}" placeholder="0, 1, 2, 3...">`;
  } else if(q.type==='composicion'){
    inner += q.fields.map(f=>`
      <label class="field-label">${esc(f.label)}</label>
      <input type="number" min="0" id="comp_${sid(q.code)}_${sid(f.key)}" value="${(existing.fields && existing.fields[f.key]) ?? ''}">
    `).join('');
  } else if(q.type==='hacinamiento'){
    inner += q.fields.map(f=>`
      <label class="field-label">${esc(f.label)}</label>
      <input type="number" min="0" id="hac_${sid(q.code)}_${sid(f.key)}" value="${(existing.fields && existing.fields[f.key]) ?? ''}">
    `).join('');
  }

  if(q.obs && hasOtro){
    const showObs = otroIsSelected(q, existing);
    inner += `<div id="obsWrap_${sid(q.code)}" style="${showObs?'':'display:none'}">
      <label class="field-label">Especifique</label>
      <textarea id="obs_${sid(q.code)}" placeholder="Escriba aquí...">${esc(existing.obs||'')}</textarea>
    </div>`;
  }

  if(q.photo){
    const fotoData = existing.foto || '';
    const showPhoto = !q.photoOnlyIf || existing.value === q.photoOnlyIf;
    inner += `
      <div class="photo-box" id="photoWrap_${sid(q.code)}" style="${showPhoto?'':'display:none'}">
        <div class="mini-meta">
          <span>DNI: ${esc(state.colaborador.dni||'—')}</span>
          <span>Elemento: ${esc(q.elemento)}</span>
        </div>
        <label class="file-btn">📷 Tomar / subir foto de ${esc(q.elemento)}
          <input type="file" accept="image/*" capture="environment" id="foto_${sid(q.code)}" style="display:none;">
        </label>
        <p class="hint" style="margin:6px 0 8px;">Se sube sola a Google Drive, en la carpeta ${esc(state.colaborador.gerencia||state.colaborador.gerenciaManual||'[gerencia]')} → ${esc(state.colaborador.dni||'[DNI]')} - ${esc(state.colaborador.nombre||state.colaborador.nombreManual||'[nombre]')} → ${esc(q.elemento)}.</p>
        <img id="fotoPrev_${sid(q.code)}" class="photo-preview" style="${fotoData?'display:block':''}" src="${fotoData}">
      </div>`;
  }

  div.innerHTML = inner;

  // listeners
  const obsWrap = hasOtro ? div.querySelector(`#obsWrap_${sid(q.code)}`) : null;
  const photoWrap = (q.photo && q.photoOnlyIf) ? div.querySelector(`#photoWrap_${sid(q.code)}`) : null;
  function syncObsVisibility(){
    if(!obsWrap) return;
    const show = otroIsSelected(q, state.answers[q.code]);
    obsWrap.style.display = show ? '' : 'none';
    if(!show){
      state.answers[q.code] = {...(state.answers[q.code]||{}), obs:''};
      const ta = obsWrap.querySelector('textarea'); if(ta) ta.value='';
    }
  }
  function syncPhotoVisibility(){
    if(!photoWrap) return;
    const show = state.answers[q.code] && state.answers[q.code].value === q.photoOnlyIf;
    photoWrap.style.display = show ? '' : 'none';
    if(!show){
      state.answers[q.code] = {...(state.answers[q.code]||{}), foto:''};
      const img = photoWrap.querySelector('img'); if(img){ img.src=''; img.style.display='none'; }
      const fileInp = photoWrap.querySelector('input[type=file]'); if(fileInp) fileInp.value='';
    }
  }

  if(q.type==='select' || q.type==='filter'){
    div.querySelectorAll(`input[name="q_${q.code}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const opt = q.options.find(o=>o.label===inp.value);
        state.answers[q.code] = {...(state.answers[q.code]||{}), value: inp.value, pts: opt.pts};
        div.querySelectorAll('.option-row').forEach(r=>r.classList.remove('selected'));
        inp.closest('.option-row').classList.add('selected');
        syncObsVisibility();
        syncPhotoVisibility();
        if(q.type==='filter'){ renderMain(); } // re-render step to show/hide rest
      });
    });
  } else if(q.type==='checkbox'){
    div.querySelectorAll(`input[name="q_${q.code}"]`).forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const cur = state.answers[q.code] || {values:[], pts:0};
        let vals = cur.values || [];
        if(inp.checked) vals.push(inp.value); else vals = vals.filter(v=>v!==inp.value);
        const pts = vals.reduce((s,v)=> s + (q.options.find(o=>o.label===v)?.pts||0), 0);
        state.answers[q.code] = {...cur, values: vals, pts};
        inp.closest('.option-row').classList.toggle('selected', inp.checked);
        syncObsVisibility();
      });
    });
  } else if(q.type==='number_score'){
    const inp = div.querySelector(`#num_${sid(q.code)}`);
    inp.addEventListener('input', ()=>{
      const v = parseInt(inp.value,10);
      let pts = q.default_pts ?? 0;
      if(!isNaN(v)){
        const found = q.mapping.find(m=>m[0]===v);
        pts = found ? found[1] : q.default_pts;
      }
      state.answers[q.code] = {value: isNaN(v)?null:v, pts};
    });
  } else if(q.type==='composicion'){
    const recalc = ()=>{
      const fields = {};
      let sum = 0;
      q.fields.forEach(f=>{
        const v = parseInt(div.querySelector(`#comp_${sid(q.code)}_${sid(f.key)}`).value,10) || 0;
        fields[f.key] = v;
        sum += v * f.weight;
      });
      const pts = Math.max(sum, q.floor);
      state.answers[q.code] = {fields, pts};
    };
    q.fields.forEach(f=> div.querySelector(`#comp_${sid(q.code)}_${sid(f.key)}`).addEventListener('input', recalc));
  } else if(q.type==='hacinamiento'){
    const recalc = ()=>{
      const fields = {};
      q.fields.forEach(f=>{ fields[f.key] = parseFloat(div.querySelector(`#hac_${sid(q.code)}_${sid(f.key)}`).value) || 0; });
      const habitaciones = fields.habitaciones || 0;
      const personas = fields.personas || 0;
      const indice = habitaciones > 0 ? +(personas/habitaciones).toFixed(2) : 0;
      let pts = 0;
      if(habitaciones===0 && personas===0){ pts = 0; }
      else if(indice<=2.4) pts = 5;
      else if(indice<=3) pts = 2;
      else pts = 0;
      state.answers[q.code] = {fields, indice, pts};
    };
    q.fields.forEach(f=> div.querySelector(`#hac_${sid(q.code)}_${sid(f.key)}`).addEventListener('input', recalc));
  }

  if(obsWrap){
    obsWrap.querySelector('textarea').addEventListener('input', (e)=>{
      state.answers[q.code] = {...(state.answers[q.code]||{}), obs: e.target.value};
    });
  }
  if(q.photo){
    div.querySelector(`#foto_${sid(q.code)}`).addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const dataUrl = await compressImage(file, 900);
      state.answers[q.code] = {...(state.answers[q.code]||{}), foto: dataUrl};
      const img = div.querySelector(`#fotoPrev_${sid(q.code)}`);
      img.src = dataUrl; img.style.display='block';
      toast('Subiendo foto a Google Drive...');
      const ok = await apiSavePhoto(dataUrl, q.elemento);
      toast(ok ? `Foto de ${q.elemento} guardada en Drive` : `No se pudo subir la foto de ${q.elemento} a Drive`);
    });
  }

  return div;
}

/* =========================================================
   CÁLCULO DE PUNTAJE Y GUARDADO
========================================================= */
function computeScores(){
  let scoreSituacion = 0, scoreRiesgo = 0;
  QUESTIONS.situacion.forEach(q=>{
    const a = state.answers[q.code];
    if(a && typeof a.pts === 'number') scoreSituacion += a.pts;
  });
  QUESTIONS.riesgo.forEach(q=>{
    const a = state.answers[q.code];
    if(a && typeof a.pts === 'number') scoreRiesgo += a.pts;
  });
  const total = scoreSituacion + scoreRiesgo;
  let nivelKey = 'bajo';
  if(total<=10) nivelKey='critico';
  else if(total<=30) nivelKey='alto';
  else if(total<=50) nivelKey='medio';
  return {scoreSituacion, scoreRiesgo, total, nivelKey};
}

async function finalizarFicha(){
  const c = state.colaborador;
  const scores = computeScores();
  const id = uid();

  // Subir la foto de fachada (si existe) recién ahora, que ya se conoce el DNI y la gerencia
  if(c.fotoVivienda){
    toast('Subiendo foto de fachada a Drive...');
    await apiSavePhoto(c.fotoVivienda, 'Fachada de vivienda');
  }

  // snapshot ligero de respuestas para análisis (sin fotos)
  const answersSnapshot = {};
  Object.keys(state.answers).forEach(code=>{
    const a = state.answers[code];
    answersSnapshot[code] = {value:a.value, values:a.values, pts:a.pts, fields:a.fields, indice:a.indice};
  });

  const indexEntry = {
    id, timestamp: Date.now(),
    sede: c.sede || c.sedeBD || '', dni: c.dni, nombre: c.nombre || c.nombreManual || '',
    gerencia: c.gerencia || c.gerenciaManual || '(sin gerencia)',
    unidad: c.unidad || c.unidadManual || '(sin unidad)',
    scoreSituacion: scores.scoreSituacion, scoreRiesgo: scores.scoreRiesgo, total: scores.total,
    nivelKey: scores.nivelKey, finalizadoTemprano: state.finalizadoTemprano,
    answers: answersSnapshot
  };

  const fullRecord = {
    ...indexEntry,
    colaborador: c,
    answersFull: state.answers
  };

  await pushVisit(indexEntry, fullRecord);
  state.step = 'done';
  state.lastResult = {...scores, id};
  renderMain();
  window.scrollTo(0,0);
}

function renderResumen(main){
  const r = state.lastResult;
  const niv = CRITICIDAD[r.nivelKey];
  main.innerHTML = `
    <div class="card" style="text-align:center;">

      <h3>Resumen de la visita</h3>
      <div class="score-circle" style="border-color:${niv.color}55;">

   ANÁLISIS POR RESPUESTA
========================================================= */
function uniqueSorted(arr){ return [...new Set(arr.filter(Boolean))].sort(); }

function buildFilterBar(idPrefix, visits, onChange, opts){
  opts = opts || {};
  const gerencias = uniqueSorted(visits.map(v=>v.gerencia).concat(COLABORADORES.map(c=>c.gerencia)));
  const unidades = uniqueSorted(visits.map(v=>v.unidad).concat(COLABORADORES.map(c=>c.unidad)));
  const html = `
    <div class="filters">
      <select id="${idPrefix}_sede">
        <option value="">Sede: Todas</option>
        <option value="Lima">Lima</option>
        <option value="Chincha">Chincha</option>
        <option value="Provincias">Provincias</option>
      </select>
      <select id="${idPrefix}_seccion">
        <option value="">Sección: Ambas</option>
        <option value="situacion">Situación</option>
        <option value="riesgo">Riesgo</option>
      </select>
      <select id="${idPrefix}_gerencia" class="full">
        <option value="">Gerencia: Todas</option>
        ${gerencias.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}
      </select>
      <select id="${idPrefix}_unidad" class="full">
        <option value="">Unidad organizativa: Todas</option>
        ${unidades.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('')}
      </select>
    </div>
  `;
  return {html, bind: (container)=>{
    ['sede','seccion','gerencia','unidad'].forEach(k=>{
      container.querySelector(`#${idPrefix}_${k}`).addEventListener('change', onChange);
    });
  }};
}
function currentFilters(idPrefix, container){
  return {
    sede: container.querySelector(`#${idPrefix}_sede`).value,
    seccion: container.querySelector(`#${idPrefix}_seccion`).value,
    gerencia: container.querySelector(`#${idPrefix}_gerencia`).value,
    unidad: container.querySelector(`#${idPrefix}_unidad`).value,
  };
}
function applyFilters(visits, f){
  return visits.filter(v=>
    (!f.sede || v.sede===f.sede) &&
    (!f.gerencia || v.gerencia===f.gerencia) &&
    (!f.unidad || v.unidad===f.unidad)
  );
}

function renderQuestionAnalysis(q, visits){
  const answered = visits.filter(v=> v.answers && v.answers[q.code] !== undefined);
  if(answered.length===0) return '';
  let html = `<div class="qblock"><div class="qtitle">${q.code} · ${esc(q.title)}</div>`;

  if(q.type==='select' || q.type==='filter'){
    const counts = {};
    answered.forEach(v=>{ const val = v.answers[q.code].value; if(val) counts[val]=(counts[val]||0)+1; });
    const max = Math.max(1, ...Object.values(counts));
    q.options.forEach(opt=>{
      const n = counts[opt.label]||0;
      html += barRow(opt.label, n, answered.length, max);
    });
  } else if(q.type==='checkbox'){
    const counts = {};
    answered.forEach(v=>{ (v.answers[q.code].values||[]).forEach(val=> counts[val]=(counts[val]||0)+1); });
    const max = Math.max(1, ...Object.values(counts));
    q.options.forEach(opt=>{
      const n = counts[opt.label]||0;
      html += barRow(opt.label, n, answered.length, max);
    });
  } else if(q.type==='number_score' || q.type==='composicion' || q.type==='hacinamiento'){
    const pts = answered.map(v=>v.answers[q.code].pts).filter(p=>typeof p==='number');
    const avg = pts.length ? (pts.reduce((a,b)=>a+b,0)/pts.length).toFixed(1) : '—';
    html += `<div class="stat-grid" style="grid-template-columns:1fr 1fr;">
      <div class="stat-card"><div class="n">${answered.length}</div><div class="l">Respuestas</div></div>
      <div class="stat-card"><div class="n">${avg}</div><div class="l">Puntaje promedio</div></div>
    </div>`;
  }
  html += `</div>`;
  return html;
}
function barRow(label, n, total, max){
  const pct = total? Math.round(n/total*100):0;
  const width = max? Math.round(n/max*100):0;
  return `<div class="barrow">
    <div class="barlabel"><span>${esc(label)}</span><span>${n} · ${pct}%</span></div>
    <div class="bartrack"><div class="barfill" style="width:${width}%"></div></div>
  </div>`;
}
function emptyState(msg){
  return `<div class="empty-state">
    <svg viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.5"><path d="M9 12h6M9 16h6M9 8h3M6 4h9l3 3v13a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1z" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <p>${msg}</p>
  </div>`;
}

/* =========================================================
   EXPORTAR A EXCEL
========================================================= */
function flattenVisitRow(v, full){
  const c = (full && full.colaborador) || {};
  const answersFull = (full && full.answersFull) || {};
  const row = {};
  const dt = new Date(v.timestamp);
  row['ID Ficha'] = v.id;
  row['Fecha'] = dt.toLocaleDateString('es-PE');
  row['Hora'] = dt.toLocaleTimeString('es-PE');
  row['Sede'] = v.sede || '';
  row['DNI'] = v.dni || '';
  row['Nombre'] = v.nombre || '';
  row['Puesto'] = c.puesto || c.puestoManual || '';
  row['Gerencia'] = v.gerencia || '';
  row['Unidad organizativa'] = v.unidad || '';
  row['Dirección'] = c.direccionTexto || '';
  row['Enlace Google Maps'] = (c.ubicacion && c.ubicacion.mapsLink) || '';

  ['situacion','riesgo'].forEach(secKey=>{
    QUESTIONS[secKey].forEach(q=>{
      const a = answersFull[q.code] || (v.answers && v.answers[q.code]) || {};
      if(q.type==='select' || q.type==='filter'){
        row[`${q.code} ${q.title}`] = a.value || '';
      } else if(q.type==='checkbox'){
        row[`${q.code} ${q.title}`] = (a.values||[]).join('; ');
      } else if(q.type==='number_score'){
        row[`${q.code} ${q.title}`] = (a.value ?? '');
      } else if(q.type==='composicion'){
        q.fields.forEach(f=>{
          row[`${q.code} ${f.label}`] = (a.fields && a.fields[f.key]!==undefined) ? a.fields[f.key] : '';
        });
      } else if(q.type==='hacinamiento'){
        q.fields.forEach(f=>{
          row[`${q.code} ${f.label}`] = (a.fields && a.fields[f.key]!==undefined) ? a.fields[f.key] : '';
        });
        row[`${q.code} Índice de hacinamiento`] = a.indice ?? '';
      }
      if(q.obs){
        row[`${q.code} Observación`] = a.obs || '';
      }
    });
  });

  row['Puntaje Situación'] = v.scoreSituacion;
  row['Puntaje Riesgo'] = v.scoreRiesgo;
  row['Puntaje Total'] = v.total;
  row['Nivel de criticidad'] = CRITICIDAD[v.nivelKey].label;
  row['¿Finalizó por no estar en zona de riesgo?'] = v.finalizadoTemprano ? 'Sí' : 'No';
  return row;
}

async function buildExportRows(filtered){
  const rows = [];
  for(const v of filtered){
    const full = await getFullVisit(v.id);
    rows.push(flattenVisitRow(v, full));
  }
  return rows;
}

function exportRowsToExcel(rows, filename){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el módulo de Excel. Verifica tu conexión a internet e inténtalo de nuevo.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Fichas');
  XLSX.writeFile(wb, filename);
}

async function handleExportClick(filtered, btn){
  if(!filtered.length){ toast('No hay fichas para exportar con estos filtros.'); return; }
  const originalText = btn.textContent;
  btn.textContent = 'Generando archivo...';
  btn.disabled = true;
  try{
    const rows = await buildExportRows(filtered);
    const stamp = new Date().toISOString().slice(0,10);
    exportRowsToExcel(rows, `Fichas_Visita_Domiciliaria_${stamp}.xlsx`);
    toast('Archivo Excel descargado');
  } catch(err){
    console.error(err);
    toast('Ocurrió un error generando el Excel');
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function openVisitDetail(id){
  const rec = await getFullVisit(id);
  if(!rec) return toast('No se pudo cargar el detalle');
  const niv = CRITICIDAD[rec.nivelKey];
  const c = rec.colaborador || {};
  let photosHtml = '';
  if(c.fotoVivienda) photosHtml += `<img src="${c.fotoVivienda}" style="width:100%;border-radius:10px;margin-bottom:8px;">`;
  Object.entries(rec.answersFull||{}).forEach(([code,a])=>{
    if(a.foto) photosHtml += `<img src="${a.foto}" style="width:100%;border-radius:10px;margin-bottom:8px;">`;
  });
  const ans = rec.answersFull || rec.answers || {};
  function answerText(q, a){
    if(!a) return '';
    if(q.type==='checkbox') return (a.values||[]).join(', ');
    if(q.type==='number_score') return (a.value===undefined||a.value===null||a.value==='') ? '' : String(a.value);
    if(q.type==='composicion' || q.type==='hacinamiento'){
      const parts = q.fields.map(f=> (a.fields && a.fields[f.key]!==undefined && a.fields[f.key]!=='') ? `${f.label}: <b>${esc(a.fields[f.key])}</b>` : '').filter(Boolean);
      if(q.type==='hacinamiento' && a.indice!==undefined && a.indice!=='') parts.push(`Índice de hacinamiento: <b>${esc(a.indice)}</b>`);
      return parts.join('<br>');
    }
    return a.value ? esc(a.value) : '';
  }
  function answersBlock(sec, title, score){
    const items = QUESTIONS[sec].map(q=>{
      const a = ans[q.code];
      const txt = answerText(q, a);
      const pts = (a && a.pts!==undefined && a.pts!==null) ? a.pts : null;
      return `<div class="ref-card" style="margin-bottom:10px;">
        <div class="section-label">${q.code}</div>
        <p style="font-weight:600;font-size:13px;margin-bottom:4px;">${esc(q.title)}</p>
        <p style="font-size:13.5px;">${txt || '<span class="hint">Sin respuesta</span>'}${pts!==null?` <span class="hint">(${pts>0?'+':''}${pts} pts)</span>`:''}</p>
        ${a && a.obs ? `<p class="hint">Observación: ${esc(a.obs)}</p>`:''}
      </div>`;
    }).join('');
    return `<h3 style="margin:14px 0 6px;">${title} <span class="hint">· ${score ?? '-'} pts</span></h3>${items}`;
  }
  document.getElementById('modalSheet').innerHTML = `
    <button class="modal-close" id="closeModal">✕</button>
    <h3>Ficha de ${esc(rec.nombre)}</h3>
    <p class="hint">DNI ${esc(rec.dni)} · ${esc(rec.gerencia)} · ${esc(rec.unidad)}${c.puesto?' · '+esc(c.puesto):''}</p>
    <div class="nivel-pill" style="background:${niv.color};margin:8px 0;">${niv.label} · ${rec.total} pts</div>
    <p style="margin:6px 0;">${riesgoBadge(rec)}</p>
    ${c.ubicacion ? `<p><a class="map-link" href="${c.ubicacion.mapsLink}" target="_blank">🗺️ Ver ubicación en Google Maps</a></p>`:''}
    ${c.direccionTexto ? `<p class="hint">Dirección: ${esc(c.direccionTexto)}</p>`:''}
    ${answersBlock('situacion','1. Situación de vivienda', rec.scoreSituacion)}
    ${answersBlock('riesgo','2. Zona de riesgo', rec.scoreRiesgo)}
    <h3 style="margin:14px 0 6px;">Fotos</h3>
    <div id="modalPhotos">${photosHtml || '<p class="hint">Cargando fotos de Drive...</p>'}</div>
  `;
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').classList.add('open');
  if(!photosHtml && rec.dni){
    apiGetPhotos(rec.dni, true).then(ph=>{
      const box = document.getElementById('modalPhotos');
      if(box) box.innerHTML = photosGridHtml(ph);
    });
  }
}

   REPORTE DE CASOS CRÍTICOS Y ALTOS
========================================================= */
const photoCache = {};      // dni -> [{pregunta,name,url,thumb}]
let photoCountsCache = null; // dni -> n

const ESTADOS_CH = {
  realizada:     {label:'Visita realizada', color:'#00823d'},
  sin_respuesta: {label:'Se estableció contacto, pero no respondió', color:'#e08900'},
  rechazada:     {label:'Visita rechazada', color:'#b3261e'}
};

function dedupeByDni(visits){
  const m = {};
  visits.forEach(v=>{
    const k = v.dni || v.id;
    if(!m[k] || (v.timestamp||0) > (m[k].timestamp||0)) m[k] = v;
  });
  return Object.values(m);
}

async function apiPhotoCounts(){
  if(photoCountsCache) return photoCountsCache;
  try{
    const r = await fetch(BACKEND_URL + '?action=photoCounts');
    const d = await r.json();
    photoCountsCache = d.counts || {};
  }catch(e){ photoCountsCache = null; }
  return photoCountsCache || {};
}

async function apiGetPhotos(dni, withThumbs){
  const key = dni + (withThumbs ? '' : '|nothumb');
  if(photoCache[dni] && (withThumbs ? photoCache[dni].some(p=>p.thumb) || !photoCache[dni].length : true)) return photoCache[dni];
  try{
    const r = await fetch(BACKEND_URL + '?action=getPhotos&dni=' + encodeURIComponent(dni) + (withThumbs ? '' : '&thumbs=0'));
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    photoCache[dni] = d.photos || [];
  }catch(e){
    console.error('apiGetPhotos', e);
    return null;
  }
  return photoCache[dni];
}

function photosGridHtml(photos){
  if(photos === null) return '<p class="hint">No se pudieron cargar las fotos. Revisa que el script de Google esté actualizado.</p>';
  if(!photos.length) return '<p class="hint">Esta persona no tiene fotos en Drive.</p>';
  return `<div class="rp-photos">${photos.map(p=>`
    <a href="${esc(p.url)}" target="_blank" rel="noopener" class="rp-photo">
      ${p.thumb ? `<img src="${p.thumb}" alt="${esc(p.pregunta)}">` : `<div class="rp-nothumb">Ver foto</div>`}
      <span>${esc(p.pregunta)}</span>
    </a>`).join('')}</div>`;
}

async function loadPersonPhotos(card){
  const dni = card.dataset.dni;
  const box = card.querySelector('.rp-photobox');
  if(box.dataset.loaded) return;
  box.innerHTML = '<p class="hint">Cargando fotos...</p>';
  const photos = await apiGetPhotos(dni, true);
  box.innerHTML = photosGridHtml(photos);
  if(photos) box.dataset.loaded = '1';
}

function riesgoBadge(rec){
  const ans = (rec && (rec.answersFull || rec.answers)) || {};
  const r = ans['2.1'] && ans['2.1'].value;
  const tipo = ans['2.2'] && ans['2.2'].value;
  if(r === 'Sí') return `<span class="rz rz-si">⚠️ Sí, en zona de riesgo${tipo ? ' · ' + esc(tipo) : ''}</span>`;
  if(r === 'No') return `<span class="rz rz-no">✔ No está en zona de riesgo</span>`;
  return `<span class="rz rz-nd">Sin dato</span>`;
}

    const gRows = Object.entries(byG).sort((a,b)=> (b[1].critico-a[1].critico) || (b[1].alto-a[1].alto) || (b[1].total-a[1].total));

    // ---- Avance de visitas vs. meta proyectada (base de colaboradores) ----

      <div class="card">
        <h3>Ubicación de los casos (${cases.length})</h3>
        <div id="rpMap" class="rp-map"></div>
        <div class="legend">${Object.values(CRITICIDAD).map(c=>`<span><i style="background:${c.color}"></i>${c.label}</span>`).join('')}</div>
      </div>
      <div class="card">
        <h3>Personas del reporte (${cases.length})</h3>
        <div id="rpCards">${cases.length ? '<p class="hint">Cargando detalle...</p>' : emptyState('No hay casos con estos filtros.')}</div>
      </div>`;
    bar.bind(root);
    const sec = root.querySelector('#rp_seccion'); if(sec) sec.style.display='none';
    const sedeSel = root.querySelector('#rp_sede'); if(sedeSel) sedeSel.style.display='none';
    // restaurar valores
    ['sede','gerencia','unidad'].forEach(k=>{ const el = root.querySelector('#rp_'+k); if(el) el.value = f[k]; });
    root.querySelector('#rp_nivel').value = nivelSel;
    root.querySelector('#rp_nivel').addEventListener('change', ()=>draw());
    root.querySelectorAll('.est-tile').forEach(t=> t.addEventListener('click', ()=>{
      estSel = (estSel === t.dataset.est) ? '' : t.dataset.est;
      draw(true);
    }));
    root.querySelectorAll('.rp-lvl').forEach(t=> t.addEventListener('click', ()=>{
      const sel = root.querySelector('#rp_nivel');
      sel.value = (sel.value === t.dataset.nivel) ? 'cam' : t.dataset.nivel;
      draw();
      const target = root.querySelector('#rpCards');
      if(target) target.closest('.card').scrollIntoView({behavior:'smooth', block:'start'});
    }));
    root.querySelectorAll('.rp-grow').forEach(tr=> tr.addEventListener('click', ()=>{
      const sel = root.querySelector('#rp_gerencia');
      const g = tr.dataset.g;
      if([...sel.options].some(o=>o.value===g)){ sel.value = g; draw(); window.scrollTo(0,0); }
    }));
    root.querySelector('#rp_excel').addEventListener('click', e=> exportReporteExcel(cases, gRows, tot, e.target, counts, avance));
    root.querySelector('#rp_print').addEventListener('click', e=> printReporte(e.target));
    if(keepScroll) window.scrollTo(0, scrollY);
    drawCards(cases);
  }

  async function drawCards(cases){
    const box = root.querySelector('#rpCards');
    const fulls = [];
    for(const v of cases) fulls.push(await getFullVisit(v.id));
    if(!root.isConnected) return;
    // mapa
    const mapEl = root.querySelector('#rpMap');
    if(map){ try{ map.remove(); }catch(e){} map = null; }
    const pts = [];
    if(typeof L !== 'undefined' && mapEl){
      map = L.map(mapEl, {zoomControl:true}).setView([-12.05,-77.04], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
      cases.forEach((v,i)=>{
        const u = fulls[i] && fulls[i].colaborador && fulls[i].colaborador.ubicacion;
        if(u && u.lat!=null && u.lng!=null){
          const col = CRITICIDAD[v.nivelKey].color;
          const m = L.circleMarker([u.lat,u.lng], {radius:9, color:'#fff', weight:2, fillColor:col, fillOpacity:1}).addTo(map);
          m.bindPopup(`<b>${esc(v.nombre)}</b><br>${esc(v.gerencia||'')}<br>${CRITICIDAD[v.nivelKey].label} (${v.total} pts)`);
          pts.push([u.lat,u.lng]);
        }
      });
      if(pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom:15});
      setTimeout(()=>map && map.invalidateSize(), 200);
    }
    if(!cases.length) return;
    box.innerHTML = cases.map((v,i)=>{
      const c = (fulls[i] && fulls[i].colaborador) || {};
      const u = c.ubicacion;
      const niv = CRITICIDAD[v.nivelKey];
      const n = counts[v.dni];
      return `<div class="rp-card" data-dni="${esc(v.dni)}" style="border-left-color:${niv.color}">
        <div class="rp-head">
          <div><b>${esc(v.nombre)}</b><div class="hint">DNI ${esc(v.dni)}${c.puesto?' · '+esc(c.puesto):''}</div></div>
          <span class="rp-nivel" style="background:${niv.color}">${niv.label} · ${v.total} pts</span>
        </div>
        <div class="rp-meta">
          <div><span>Gerencia</span>${esc(v.gerencia||'-')}</div>
          <div><span>Unidad</span>${esc(v.unidad||'-')}</div>
          <div><span>Sede</span>${esc(v.sede||'-')}</div>
          <div><span>Puntaje de situación de vivienda</span>${v.scoreSituacion ?? '-'} pts</div>
          <div><span>¿Vive en zona de riesgo?</span>${riesgoBadge(fulls[i] || v)}</div>
          <div class="wide"><span>Dirección</span>${esc(c.direccionTexto || c.direccionBD || 'Sin dirección registrada')}</div>
        </div>
        <div class="rp-actions no-print">
          ${u && u.mapsLink ? `<a class="btn btn-ghost" href="${esc(u.mapsLink)}" target="_blank" rel="noopener">📍 Cómo llegar</a>` : ''}
          <button class="btn btn-ghost" data-photos>📷 Ver fotos${n!=null?` (${n})`:''}</button>
          <button class="btn btn-ghost" data-ficha="${esc(v.id)}">Ver ficha</button>
        </div>
        <div class="rp-photobox"></div>
      </div>`;
    }).join('');
    box.querySelectorAll('.rp-card').forEach(card=>{
      card.querySelector('[data-photos]').addEventListener('click', ()=> loadPersonPhotos(card));
      card.querySelector('[data-ficha]').addEventListener('click', e=> openVisitDetail(e.target.dataset.ficha));
    });
  }
}

async function printReporte(btn){
  const cards = [...document.querySelectorAll('#rpCards .rp-card')];
  if(!cards.length){ toast('No hay casos para imprimir con estos filtros.'); return; }
  const old = btn.textContent; btn.disabled = true;
  try{
    for(let i=0;i<cards.length;i++){
      btn.textContent = `Cargando fotos ${i+1}/${cards.length}...`;
      await loadPersonPhotos(cards[i]);
    }
  } finally { btn.textContent = old; btn.disabled = false; }
  const mapEl = document.getElementById('rpMap');
  setTimeout(()=> window.print(), 300);
}

async function exportReporteExcel(cases, gRows, tot, btn, counts, avance){
  counts = counts || {};
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el módulo de Excel. Verifica tu conexión.'); return; }
  if(!cases.length){ toast('No hay casos para exportar con estos filtros.'); return; }
  const old = btn.textContent; btn.disabled = true;
  try{
    const casos = [];
    for(let i=0;i<cases.length;i++){
      btn.textContent = `Generando ${i+1}/${cases.length}...`;
      const v = cases[i];
      const full = await getFullVisit(v.id);
      const c = (full && full.colaborador) || {};
      const u = c.ubicacion || {};
      const photos = (counts[v.dni] === 0) ? [] : ((await apiGetPhotos(v.dni, false)) || []);
      casos.push({
        'Nivel': CRITICIDAD[v.nivelKey].label,
        'Puntaje total': v.total,
        'Puntaje Situación': v.scoreSituacion,
        'Puntaje Riesgo': v.scoreRiesgo,
        '¿Vive en zona de riesgo?': ((full && full.answersFull && full.answersFull['2.1'] && full.answersFull['2.1'].value) || 'Sin dato'),
        'Tipo de riesgo': ((full && full.answersFull && full.answersFull['2.2'] && full.answersFull['2.2'].value) || ''),
        'DNI': v.dni, 'Nombre': v.nombre, 'Puesto': c.puesto || '',
        'Gerencia': v.gerencia || '', 'Unidad organizativa': v.unidad || '', 'Sede': v.sede || '',
        'Dirección': c.direccionTexto || c.direccionBD || '',
        'Latitud': u.lat ?? '', 'Longitud': u.lng ?? '',
        'Enlace Google Maps': u.mapsLink || '',
        'Cantidad de fotos': photos.length,
        'Enlaces de fotos': photos.map(p=>p.pregunta+': '+p.url).join('\n')
      });
    }
    const resumen = gRows.map(([g,d])=>({'Gerencia':g,'Críticos':d.critico,'Altos':d.alto,'Medios':d.medio,'Bajos':d.bajo,'Total personas':d.total,'Fotos':d.fotos}));
    resumen.push({'Gerencia':'TOTAL','Críticos':tot.critico,'Altos':tot.alto,'Medios':tot.medio,'Bajos':tot.bajo,'Total personas':tot.total,'Fotos':tot.fotos});
    const wb = XLSX.utils.book_new();
    if(avance){
      const avRows = (obj)=>Object.entries(obj).map(([k,d])=>({'Nombre':k,'Visitas proyectadas':d.proy,'Visitas realizadas':d.vis,'Pendientes':d.proy-d.vis,'Avance %':d.proy?Math.round(d.vis/d.proy*100):0}));
      const avAll = [{'Nombre':'TOTAL','Visitas proyectadas':avance.proyTotal,'Visitas realizadas':avance.visBase,'Pendientes':avance.proyTotal-avance.visBase,'Avance %':avance.proyTotal?Math.round(avance.visBase/avance.proyTotal*100):0}]
        .concat([{'Nombre':'— Por sede —'}], avRows(avance.avS), [{'Nombre':'— Por gerencia —'}], avRows(avance.avG));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(avAll), 'Avance de visitas');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(avance.pendientes.map(c=>({'DNI':c.dni,'Nombre':c.nombre,'Puesto':c.puesto||'','Sede':c.sede,'Gerencia':c.gerencia,'Unidad organizativa':c.unidad,'Distrito':c.distrito||'','Dirección':c.direccion||''}))), 'Pendientes de visita');
    }
    if(avance && avance.chRows){
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(avance.chRows), 'Estado Chincha');
    }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumen), 'Resumen por gerencia');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(casos), 'Casos');
    XLSX.writeFile(wb, `Reporte_Casos_${new Date().toISOString().slice(0,10)}.xlsx`);
    toast('Reporte descargado');
  }catch(err){ console.error(err); toast('Ocurrió un error generando el reporte'); }
  finally{ btn.textContent = old; btn.disabled = false; }
}

/* =========================================================
   INIT
========================================================= */
renderTabbar();
renderMain();
if(!BACKEND_URL) showBackendSetupModal(false);

</script>
